spring.application.name=ganesh-festival-collection

# ---- MySQL ----
# For local dev:
spring.datasource.url=jdbc:mysql://localhost:3306/ganesh_festival?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# When deploying (Railway/Render), override these 3 with env vars instead of editing this file:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Extra safety net alongside the Hibernate6Module registration in JacksonConfig -
# stops Jackson erroring on entities/proxies with no visible properties instead
# of crashing the whole response.
spring.jackson.serialization.fail-on-empty-beans=false

server.port=8080

# ---- JWT ----
# CHANGE THIS before deploying anywhere public. Must be a long random string.
app.jwt.secret=ChangeThisToALongRandomSecretKeyBeforeDeployingToProductionPlease123456
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Comma separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- File uploads (velam item photos) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Absolute path under the user's home folder - deliberately NOT a relative
# path, which resolves against whatever directory the JVM happens to launch
# from and can silently change between runs (mvn vs IntelliJ vs packaged jar),
# causing previously-uploaded photos to "disappear" because the app is now
# looking in a different place than where they were written.
app.upload.dir=${user.home}/ganesh-fest-uploads/velam-items
