spring.application.name=ganesh-festival-collection

# ---- MySQL ----
# For local dev:
spring.datasource.url=jdbc:mysql://localhost:3306/ganesh_festival?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# When deploying (Railway/Render), override these 3 with env vars instead of editing this file:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Extra safety net alongside the Hibernate6Module registration in JacksonConfig -
# stops Jackson erroring on entities/proxies with no visible properties instead
# of crashing the whole response.
spring.jackson.serialization.fail-on-empty-beans=false

server.port=8080

# ---- JWT ----
# CHANGE THIS before deploying anywhere public. Must be a long random string.
app.jwt.secret=ChangeThisToALongRandomSecretKeyBeforeDeployingToProductionPlease123456
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Comma separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Mail (used for the admin "Forgot password" flow) ----
# For local dev/testing without a real SMTP account, point these at a
# throwaway inbox service (e.g. Mailtrap/Ethereal) or your own Gmail with an
# App Password. In production, override every one of these with env vars:
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, APP_MAIL_FROM
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=suneel901435@gmail.com
spring.mail.password=Subbu@901435
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# "From" address on the reset email - can be the same as spring.mail.username
app.mail.from=noreply@ganeshfest.local

# ---- Admin frontend base URL ----
# Used to build the link inside the password-reset email
# (<this>/reset-password?token=...). Override with APP_FRONTEND_ADMIN_URL
# when you deploy the frontend somewhere other than localhost.
app.frontend.admin-url=http://localhost:5173/admin

# ---- File uploads (velam item photos, gallery photos, ...) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Absolute path under the user's home folder - deliberately NOT a relative
# path, which resolves against whatever directory the JVM happens to launch
# from and can silently change between runs (mvn vs IntelliJ vs packaged jar),
# causing previously-uploaded photos to "disappear" because the app is now
# looking in a different place than where they were written.
#
# This is a BASE directory shared by every upload feature - each controller
# writes into its own subfolder underneath it (velam-items, gallery, ...) and
# returns a URL like /uploads/<subfolder>/<file>. WebConfig maps /uploads/**
# straight onto this base dir, so the subfolder in the URL and the subfolder
# on disk always line up.
app.upload.dir=${user.home}/ganesh-fest-uploads
